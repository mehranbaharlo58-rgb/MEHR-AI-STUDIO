[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mehr-ai-studio"
version = "0.4.1"
description = "Modular AI studio with project memory, quality checks, and MCP tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.27.2,<2.0.0", "httpx>=0.27.0", "python-dotenv>=1.0.1", "PyJWT[crypto]>=2.10.1,<3.0.0", "pydantic>=2.7,<3.0", "uvicorn>=0.30,<1.0", "fastapi>=0.115,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "build>=1.2"]

[project.scripts]
mehr-ai-studio = "mehr_ai_studio.server:main"
mehr-ai-studio-check = "mehr_ai_studio.selfcheck:main"
mehr-ai-studio-http = "mehr_ai_studio.http_server:main"
mehr-ai-gateway = "mehr_ai_studio.gateway:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
mehr_ai_studio = ["data/*.json"]
