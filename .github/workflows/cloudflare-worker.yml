name: cloudflare-worker
on:
  push:
    paths:
      - "cloudflare/**"
      - "tests/cloudflare-worker.test.mjs"
      - "tests/ui-script.test.mjs"
      - "ui/**"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-worker.yml"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  pull_request:
    paths:
      - "cloudflare/**"
      - "tests/cloudflare-worker.test.mjs"
      - "tests/ui-script.test.mjs"
      - "ui/**"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-worker.yml"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate GitHub Actions workflow syntax
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml
      - name: Validate Wrangler configuration and build Worker
        run: npx --yes wrangler@4.168.0 deploy --dry-run --config wrangler.jsonc
      - name: Run Worker and UI regression tests
        run: node --test tests/cloudflare-worker.test.mjs tests/ui-script.test.mjs
