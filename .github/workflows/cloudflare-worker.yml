name: cloudflare-worker
on:
  push:
    paths:
      - "cloudflare/**"
      - "tests/cloudflare-worker.test.mjs"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-worker.yml"
  pull_request:
    paths:
      - "cloudflare/**"
      - "tests/cloudflare-worker.test.mjs"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/cloudflare-worker.test.mjs
