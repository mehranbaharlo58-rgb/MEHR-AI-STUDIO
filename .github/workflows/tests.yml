name: tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
      - run: python -m build
      - name: Build authenticated MCP container image
        run: docker build --tag mehr-ai-studio-mcp:test .
      - name: Validate isolated MCP compose configuration
        run: cp .env.mcp.example .env.mcp && docker compose config --quiet
      - name: Install built wheel in a clean virtual environment
        run: |
          python -m venv .venv-smoke
          .venv-smoke/bin/python -m pip install dist/*.whl
      - name: Run installed console command
        run: .venv-smoke/bin/mehr-ai-studio-check
      - name: Run installed module check
        run: .venv-smoke/bin/python -m mehr_ai_studio.selfcheck
      - name: Upload installable distributions
        uses: actions/upload-artifact@v4
        with:
          name: mehr-ai-studio-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14
