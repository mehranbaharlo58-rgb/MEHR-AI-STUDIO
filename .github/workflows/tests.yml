name: tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
      - run: python -m build
      - name: Upload installable distributions
        uses: actions/upload-artifact@v4
        with:
          name: mehr-ai-studio-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14
