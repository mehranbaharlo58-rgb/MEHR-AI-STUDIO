name: live AI provider integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_MODEL: ${{ secrets.AI_MODEL }}
      AI_TIMEOUT_SECONDS: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate provider secrets
        shell: bash
        run: |
          missing=0
          for name in AI_BASE_URL AI_API_KEY AI_MODEL; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add AI_BASE_URL, AI_API_KEY, and AI_MODEL under Settings > Secrets and variables > Actions, then rerun this workflow."
            exit 1
          fi
          echo "Provider configuration is present; secret values are not printed."
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run live provider smoke test
        run: pytest -q tests/test_provider_live.py
